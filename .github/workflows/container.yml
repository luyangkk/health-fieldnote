name: Build private container
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: health-fieldnote-main
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build and test Linux amd64 image
        run: |
          set -eu
          docker buildx build --load --pull --provenance=false --sbom=false --platform linux/amd64 --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "health-fieldnote:sha-$GITHUB_SHA" .
          docker pull --platform linux/amd64 caddy:2-alpine
      - name: Package images and deployment templates
        run: |
          set -eu
          mkdir bundle
          docker save "health-fieldnote:sha-$GITHUB_SHA" caddy:2-alpine | gzip -1 > bundle/images.tar.gz
          cp deploy/compose.yaml deploy/Caddyfile deploy/unraid.env.example bundle/
          printf '%s\n' "$GITHUB_SHA" > bundle/commit.txt
          (cd bundle && sha256sum images.tar.gz compose.yaml Caddyfile unraid.env.example commit.txt > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unraid-amd64
          path: bundle/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Publish and verify the private GHCR image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -eu
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          docker tag "health-fieldnote:sha-$GITHUB_SHA" "$IMAGE:latest"
          docker tag "health-fieldnote:sha-$GITHUB_SHA" "$IMAGE:sha-$GITHUB_SHA"
          docker image push --platform linux/amd64 "$IMAGE:latest"
          docker image push --platform linux/amd64 "$IMAGE:sha-$GITHUB_SHA"
          docker buildx imagetools inspect "$IMAGE:latest"
